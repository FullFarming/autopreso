<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA Caption Controller</title>
    <script>
      // Anti-flash: adopt the stored UI language before the console renders.
      try {
        const stored = localStorage.getItem("realtime-noel-ui-language");
        const lang = stored === "en" || stored === "ko" || stored === "ja" ? stored : "ko";
        document.documentElement.lang = lang;
        document.documentElement.dataset.uiLang = lang;
      } catch { /* storage optional */ }
    </script>
    <link rel="stylesheet" href="/subtitle.css" />
    <link rel="stylesheet" href="/system-language-button.css" />
    <link rel="stylesheet" href="/subtitle-controller-refined.css" />
    <link rel="stylesheet" href="/subtitle-speakers.css" />
    <link rel="stylesheet" href="/subtitle-controls.css" />
  </head>
  <body class="subtitle-controller-body">
    <main class="caption-controller-window refined-controller" aria-label="라이브 자막 제어">
      <section id="controller-caption-popover" class="controller-popover" role="dialog" aria-modal="false" aria-labelledby="caption-popover-title" hidden>
        <header><h2 id="caption-popover-title">자막 설정</h2><button type="button" data-close-popover aria-label="자막 설정 닫기">×</button></header>
        <div class="controller-popover-scroll">
          <p class="controller-muted">선택한 모든 화면에 적용</p>
          <fieldset><legend>자막 위치</legend><div class="controller-position-grid">
            <button type="button" data-controller-position="top-center" aria-pressed="false"><span class="position-preview top"></span>상단</button>
            <button type="button" data-controller-position="middle-center" aria-pressed="false"><span class="position-preview middle"></span>중앙</button>
            <button type="button" data-controller-position="bottom-center" aria-pressed="false"><span class="position-preview bottom"></span>하단</button>
          </div></fieldset>
          <div class="controller-slider-field"><label for="controller-font-range">글자 크기</label><output id="controller-font-size">38px</output><input id="controller-font-range" type="range" min="18" max="72" step="1" value="38" /><div class="range-labels"><span>18px</span><span>72px</span></div></div>
          <div class="controller-slider-field"><label for="controller-opacity">배경 투명도</label><output id="controller-opacity-value">8%</output><input id="controller-opacity" type="range" min="0" max="100" step="1" value="8" /><div class="range-labels"><span>불투명</span><span>투명</span></div></div>
          <p class="controller-muted">미리보기</p><div id="controller-caption-preview">오늘 회의의 핵심 내용을 공유합니다.</div>
        </div><footer><span id="controller-appearance-status" role="status" aria-live="polite" aria-atomic="true">즉시 반영</span><button type="button" data-close-popover>닫기</button></footer>
      </section>
      <section id="controller-output-popover" class="controller-popover" role="dialog" aria-modal="false" aria-labelledby="output-popover-title" hidden>
        <header><h2 id="output-popover-title">출력 설정</h2><button type="button" data-close-popover aria-label="출력 설정 닫기">×</button></header>
        <div class="controller-popover-scroll"><p class="controller-muted">컨트롤러 위치</p><p id="controller-display-location">MacBook 내장 화면</p>
          <fieldset><legend>자막 표시 화면</legend><div id="controller-display-options"></div></fieldset>
          <div class="controller-web-output"><span>웹앱 · 자막 및 기록</span><strong id="controller-web-output-status">사용 안 함</strong></div>
          <button id="controller-mute-captions" type="button" aria-pressed="false">자막 잠시 숨기기</button>
          <div class="legacy-display-controls" hidden><select id="controller-display" aria-label="자막 표시 화면"></select><button id="controller-all-displays" type="button" role="switch" aria-checked="false">모든 화면</button></div>
        </div><footer><span id="controller-output-count" role="status">화면 확인 중</span><button type="button" data-close-popover>닫기</button></footer>
      </section>
      <section id="controller-mic-popover" class="controller-popover" role="dialog" aria-modal="false" aria-labelledby="mic-popover-title" hidden>
        <header><h2 id="mic-popover-title">오디오 입력</h2><button type="button" data-close-popover aria-label="오디오 입력 닫기">×</button></header>
        <p class="controller-muted">입력 장치와 음량은 메인 화면에서 설정합니다.</p><button id="controller-main-window" type="button">메인 화면 열기</button><button id="controller-host-speak" type="button" hidden>호스트 발언 시작</button>
        <footer><button id="controller-restart" type="button">자막 연결 복구</button><button type="button" data-close-popover>닫기</button></footer>
      </section>
      <section id="controller-speaker-popover" class="controller-popover" role="dialog" aria-modal="false" aria-labelledby="controller-speaker-title" hidden>
        <header><h2 id="controller-speaker-title">현재 발언자</h2><button type="button" data-close-popover aria-label="발언자 선택 닫기">×</button></header>
        <div class="controller-popover-scroll"><div data-speaker-current></div><div data-speaker-options class="speaker-options"></div></div>
        <footer><span data-speaker-status role="status" aria-live="polite">불러오는 중</span><button type="button" data-speaker-retry hidden>새로고침</button><button type="button" data-close-popover>닫기</button></footer>
      </section>
      <div class="controller-bar">
        <strong class="controller-wordmark">NOVA</strong>
        <div id="controller-live-call-status" class="controller-session-status" role="status" aria-live="polite" aria-atomic="true"><span class="controller-state-dot" aria-hidden="true"></span><span id="controller-health-label">자막 준비됨</span><span id="controller-health-detail" aria-hidden="true" hidden></span></div>
        <span class="mp-vu" aria-hidden="true"><i id="controller-vu-fill"></i></span>
        <button type="button" data-controller-popover="controller-mic-popover" aria-expanded="false" aria-controls="controller-mic-popover" aria-label="오디오 입력"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3"/></svg><span>마이크</span></button>
        <button id="controller-current-speaker" type="button" data-controller-popover="controller-speaker-popover" aria-expanded="false" aria-controls="controller-speaker-popover" aria-label="현재 발언자 선택" hidden><span>발언자</span></button>
        <button type="button" data-controller-popover="controller-caption-popover" aria-expanded="false" aria-controls="controller-caption-popover"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h4m2 0h4M7 14h10"/></svg><span>자막</span></button>
        <button type="button" data-controller-popover="controller-output-popover" aria-expanded="false" aria-controls="controller-output-popover"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M12 17v4m-5 0h10"/></svg><span>출력</span></button>
        <div id="controller-live-call" hidden><button id="controller-go-live" type="button">Go-Live</button><button id="controller-end-live-call" type="button" class="controller-end">종료</button><span id="controller-elapsed" hidden>00:00</span><span id="controller-engine" class="mp-engine" role="status" hidden></span></div>
        <button id="controller-stop" type="button" class="controller-end">종료</button>
        <button id="controller-drag" class="controller-drag" type="button" aria-label="컨트롤러 이동"><svg viewBox="0 0 20 24" aria-hidden="true"><circle cx="6" cy="5" r="1"/><circle cx="14" cy="5" r="1"/><circle cx="6" cy="12" r="1"/><circle cx="14" cy="12" r="1"/><circle cx="6" cy="19" r="1"/><circle cx="14" cy="19" r="1"/></svg></button>
        <div id="controller-system-language" hidden></div>
      </div>
    </main>
    <script type="module" src="/subtitle-controller.js"></script>
  </body>
</html>
