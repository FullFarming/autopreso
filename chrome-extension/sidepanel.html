<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Realtime Noel Viewer</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <div>
        <span class="eyebrow">Realtime Noel</span>
        <h1>Live Viewer</h1>
      </div>
      <span class="private">조직용</span>
    </header>
    <form id="viewer-form">
      <label for="display-name">표시할 이름</label>
      <input id="display-name" name="displayName" autocomplete="name" maxlength="40" placeholder="예: Noel" required />
      <label for="code">6자리 인증번호</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required />
      <label for="language">내 언어</label>
      <select id="language" name="language">
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
        <option value="zh-Hans">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="ru">Русский</option>
        <option value="hi">हिन्दी</option>
        <option value="id">Bahasa Indonesia</option>
        <option value="vi">Tiếng Việt</option>
        <option value="it">Italiano</option>
      </select>
      <button type="submit">사이드패널에서 보기</button>
      <p id="form-error" role="alert"></p>
    </form>
    <section id="viewer-shell" hidden>
      <div class="viewer-toolbar">
        <span id="viewer-output-state" aria-live="polite">연결 상태 확인 중</span>
        <button type="button" id="change-session">번호 변경</button>
      </div>
      <iframe id="viewer-frame" title="Realtime Noel 실시간 뷰어" allow="autoplay; picture-in-picture" referrerpolicy="no-referrer"></iframe>
    </section>
    <p class="privacy">아이디와 비밀번호 없이 이름과 인증번호로 참여합니다. 자막 모드에서는 AI 합성 음성을 사용하지 않습니다. Meeting의 AI 합성 통역 음성을 포함한 모든 통역 음성은 뷰어에서 재생을 누르기 전까지 음소거됩니다.</p>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
