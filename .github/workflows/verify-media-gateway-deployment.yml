name: verify media gateway deployment contract

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      region:
        required: true
        type: string
      service:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      service_account:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      project_id:
        description: Google Cloud project id
        required: true
        type: string
      region:
        description: Cloud Run region
        required: true
        type: string
      service:
        description: Cloud Run service name
        required: true
        type: string
      workload_identity_provider:
        description: Workload Identity Provider resource name
        required: true
        type: string
      service_account:
        description: Read-only Cloud Run auditor service account
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUD_RUN_PROJECT: ${{ inputs.project_id }}
      CLOUD_RUN_REGION: ${{ inputs.region }}
      CLOUD_RUN_SERVICE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Verify deployed runtime contract
        run: >-
          node ./scripts/verify-cloud-run-scale-zero.mjs
          --project "$CLOUD_RUN_PROJECT"
          --region "$CLOUD_RUN_REGION"
          --service "$CLOUD_RUN_SERVICE"
