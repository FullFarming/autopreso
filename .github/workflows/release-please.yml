name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      nova_released: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  validate-nova-package:
    needs: release-please
    if: ${{ needs.release-please.outputs.nova_released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # NOVA registry ownership and trusted publishing are configured separately.
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: nova-package
          path: nova-*.tgz
