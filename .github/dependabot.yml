version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/webapp"
      - "/media-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Asia/Seoul"
    groups:
      workflow-actions:
        patterns:
          - "*"
